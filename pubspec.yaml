name: merchant
description: "PlateRoute Merchant — kitchen order management app for restaurant staff."
publish_to: 'none'

version: 1.0.0+1

flutter:
  generate: true

environment:
  sdk: ^3.13.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Environment
  flutter_dotenv: ^6.0.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Shared prefs
  shared_preferences: ^2.3.3

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Audio
  audioplayers: ^6.1.0

  # Haptics / vibration
  vibration: ^2.0.0

  # Image handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Internationalization
  intl: ^0.20.3

  # Error tracking
  sentry_flutter: ^8.11.0

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.5
  collection: ^1.18.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/audio/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
